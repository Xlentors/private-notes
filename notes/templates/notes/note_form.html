{% extends "notes/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
    <h2>{{ page_title }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Note</button>
    </form>

    <p>
        <a href="{% url 'note_list' %}">Cancel</a>
    </p>
{% endblock %}
