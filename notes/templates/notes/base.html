<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Private Notes{% endblock %}</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #222;
        }

        header {
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #ddd;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <a href="{% url 'note_list' %}">Private Notes</a>
        </h1>

        <nav>
            {% if user.is_authenticated %}
                <p>Logged in as {{ user.username }}</p>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log In</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
