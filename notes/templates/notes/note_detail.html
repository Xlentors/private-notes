{% extends "notes/base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <article>
        <h2>{{ note.title }}</h2>
        <p>{{ note.body }}</p>
        <p>Created: {{ note.created_at }}</p>
        <p>Updated: {{ note.updated_at }}</p>


        <p>
            <a href="{% url 'note_edit' note.id %}">Edit Note</a>
        </p>
    </article>

    <p>
        <a href="{% url 'note_list' %}">Back to notes</a>
    </p>
{% endblock %}
