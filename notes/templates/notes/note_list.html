{% extends "notes/base.html" %}

{% block title %}Notes{% endblock %}

{% block content %}
    <h2>Notes</h2>

    <ul>
        {% for note in notes %}
            <li>
                <a href="{% url 'note_detail' note.id %}">
                    {{ note.title }}
                </a>
            </li>
        {% empty %}
            <li>No notes yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
