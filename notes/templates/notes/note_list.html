{% extends "notes/base.html" %}

{% block title %}Notes{% endblock %}

{% block content %}
    <h2>Notes</h2>

    <p>
        <a href="{% url 'note_create' %}">Create note</a>
    </p>

    <ul>
        {% for note in notes %}
            <li>
                <a href="{% url 'note_detail' note.id %}">
                    {{ note.title }}
                </a>

                {% if note.is_public %}
                    {Public}
                {% else %}
                    {Private}
                {% endif %}
            </li>
        {% empty %}
            <li>No notes yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
