{% extends "notes/base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
    <h2>Log In</h2>

    {% if form.errors %}
        <p class="form-error">Your username or password was incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Log In</button>
    </form>
{% endblock %}
